      verifies: full domain headings and version-CR/mockup/trace table schemas; GWT/type/unique-ID negative mutations
    - id: REF-INTEGRATION
      tests: [test_refinement_actual_writer_readback_paths_context_and_lifecycle_handoff]
      parameters: [new EPIC/FEATURE, legacy FEATURE]
