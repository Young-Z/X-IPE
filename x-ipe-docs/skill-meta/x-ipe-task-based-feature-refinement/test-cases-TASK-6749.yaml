    - id: REF-FAILURES
      tests: [test_refinement_real_helper_errors_preserve_state, test_refinement_helper_semantic_gaps_not_domain_success]
      verifies: bad folder/tag/feature/locked errors nonzero and unchanged; skipped/missing semantic gaps honestly characterized
    - id: REF-CONSUMERS
      tests: [test_refinement_actual_action_prompt_and_artifact_contract]
      verifies: mandatory per-feature action, both required contexts/tags and EN/ZH feature/input prompt fields
